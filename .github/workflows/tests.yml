name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '^12.0', testbench: '^10.3', pest: '^3.8', pest_plugin: '^3.2', inertia: '^2.0' }
          - { php: '8.4', laravel: '^13.0', testbench: '^11.0', pest: '^4.0', pest_plugin: '^4.0', inertia: '^3.0' }
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: sqlite3, zip, fileinfo
      - name: Install matrix dependencies
        run: |
          composer require --dev \
            laravel/framework:${{ matrix.laravel }} \
            inertiajs/inertia-laravel:${{ matrix.inertia }} \
            orchestra/testbench:${{ matrix.testbench }} \
            pestphp/pest:${{ matrix.pest }} \
            pestphp/pest-plugin-laravel:${{ matrix.pest_plugin }} \
            --with-all-dependencies --no-interaction --no-progress
      - run: composer validate --strict --no-check-lock
      - run: vendor/bin/pest
      - run: composer audit
